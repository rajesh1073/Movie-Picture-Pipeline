name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci
      - name: Run lint
        working-directory: starter/frontend
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json
      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci
      - name: Run tests
        working-directory: starter/frontend
        run: npm run test -- --watchAll=false

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set image name
        id: image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push frontend image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ vars.REACT_APP_MOVIE_API_URL || 'http://a0eed145dcc9246dc9a5c06530b3226e-309876200.us-east-1.elb.amazonaws.com' }}" \
            -t "${{ steps.image.outputs.image }}" .
          docker push "${{ steps.image.outputs.image }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name cluster
      - name: Deploy frontend
        run: |
          kubectl set image deployment/frontend frontend="${{ needs.build.outputs.image }}"
          kubectl rollout status deployment/frontend --timeout=5m
